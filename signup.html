<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — CoinBrave</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="logo">
      <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 1.8 3.6 5.5v6.2c0 5 3.5 9.1 8.4 10.5 4.9-1.4 8.4-5.5 8.4-10.5V5.5L12 1.8z" fill="#f0b90b"/>
        <path d="M12 5.5 6.6 8v3.7c0 3.1 2.1 5.7 5.4 6.6 3.3-.9 5.4-3.5 5.4-6.6V8L12 5.5z" fill="#0b0e11"/>
        <text x="12" y="15.3" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="6.2" font-weight="800" fill="#f0b90b">B</text>
      </svg>
      <span>CoinBrave</span>
    </div>
    <nav class="nav"></nav>
  </header>

  <main class="auth-wrap">
    <div class="auth-card">
      <h1>Create your account</h1>
      <p class="sub">Start with $5,000 demo funds + a starter portfolio.</p>

      <div id="err" class="form-error"></div>

      <form id="signupForm" novalidate>
        <div class="form-group">
          <label for="name">Full name</label>
          <input id="name" type="text" required placeholder="Satoshi Nakamoto" autocomplete="name" />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" required placeholder="you@example.com" autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="password">Password (min 8 chars)</label>
          <input id="password" type="password" required minlength="8" placeholder="••••••••" autocomplete="new-password" />
          <div class="strength-bar" id="strengthBar"><div class="seg"></div><div class="seg"></div><div class="seg"></div></div>
          <div class="strength-label" id="strengthLabel"></div>
        </div>
        <div class="form-group">
          <label for="confirm">Confirm password</label>
          <input id="confirm" type="password" required placeholder="••••••••" autocomplete="new-password" />
        </div>
        <div class="form-group">
          <label for="refCode">Referral code (optional)</label>
          <input id="refCode" type="text" placeholder="REF-XXXXXX" autocomplete="off" style="font-family:ui-monospace,monospace" />
          <div id="refHint" class="muted" style="font-size:0.78rem"></div>
        </div>
        <label class="checkbox-row">
          <input type="checkbox" id="agreeTerms" />
          <span>I agree to the <a href="terms.html" target="_blank">Terms of Use</a> and <a href="privacy.html" target="_blank">Privacy Policy</a></span>
        </label>
        <button id="submitBtn" class="btn-primary" type="submit">Create Account</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </main>

  <script src="auth.js"></script>
  <script src="signup.js"></script>
</body>
</html>
