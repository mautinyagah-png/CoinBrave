<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — CoinBrave</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="logo">
      <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 1.8 3.6 5.5v6.2c0 5 3.5 9.1 8.4 10.5 4.9-1.4 8.4-5.5 8.4-10.5V5.5L12 1.8z" fill="#f0b90b"/>
        <path d="M12 5.5 6.6 8v3.7c0 3.1 2.1 5.7 5.4 6.6 3.3-.9 5.4-3.5 5.4-6.6V8L12 5.5z" fill="#0b0e11"/>
        <text x="12" y="15.3" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="6.2" font-weight="800" fill="#f0b90b">B</text>
      </svg>
      <span>CoinBrave</span>
    </div>
    <nav class="nav"></nav>
  </header>

  <main class="auth-wrap">
    <div class="auth-card">
      <h1>Set a new password</h1>
      <p class="sub">Choose a strong password for your account.</p>

      <div id="err" class="form-error"></div>
      <div id="success" class="form-error" style="color: var(--up); background: rgba(14,203,129,0.08); border: 1px solid rgba(14,203,129,0.3); padding: 12px; border-radius: 8px;"></div>

      <form id="resetForm" novalidate>
        <div class="form-group">
          <label for="password">New password (min 8 chars)</label>
          <input id="password" type="password" required minlength="8" placeholder="••••••••" autocomplete="new-password" />
          <div class="strength-bar" id="strengthBar"><div class="seg"></div><div class="seg"></div><div class="seg"></div></div>
          <div class="strength-label" id="strengthLabel"></div>
        </div>
        <div class="form-group">
          <label for="confirm">Confirm password</label>
          <input id="confirm" type="password" required placeholder="••••••••" autocomplete="new-password" />
        </div>
        <button id="submitBtn" class="btn-primary" type="submit">Update Password</button>
      </form>

      <p class="auth-switch"><a href="login.html">← Back to login</a></p>
    </div>
  </main>

  <script src="supabase.js"></script>
  <script src="auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      cbRenderNav();
      const form = document.getElementById("resetForm");
      const errEl = document.getElementById("err");
      const successEl = document.getElementById("success");
      const btn = document.getElementById("submitBtn");
      const pwInput = document.getElementById("password");
      const strengthBar = document.getElementById("strengthBar");
      const strengthLabel = document.getElementById("strengthLabel");

      pwInput.addEventListener("input", () => {
        const pw = pwInput.value;
        const s = cbPasswordStrength(pw);
        strengthBar.className = "strength-bar " + s.level;
        strengthLabel.className = "strength-label " + s.level;
        strengthLabel.textContent = pw ? s.label : "";
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errEl.classList.remove("show");
        successEl.style.display = "none";

        const password = pwInput.value;
        const confirm = document.getElementById("confirm").value;

        if (password.length < 8) {
          errEl.textContent = "Password must be at least 8 characters.";
          errEl.classList.add("show");
          return;
        }
        if (password !== confirm) {
          errEl.textContent = "Passwords do not match.";
          errEl.classList.add("show");
          return;
        }

        btn.disabled = true;
        btn.textContent = "Updating…";

        try {
          const { error } = await window.sb.auth.updateUser({ password });
          if (error) throw error;
          successEl.textContent = "Password updated! Redirecting to login…";
          successEl.style.display = "block";
          setTimeout(() => { location.href = "login.html"; }, 2000);
        } catch (err) {
          console.error(err);
          errEl.textContent = err.message || "Something went wrong. Link may have expired.";
          errEl.classList.add("show");
          btn.disabled = false;
          btn.textContent = "Update Password";
        }
      });
    });
  </script>
</body>
</html>
