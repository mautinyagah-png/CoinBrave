<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trade — CoinBrave</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="logo">
      <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 1.8 3.6 5.5v6.2c0 5 3.5 9.1 8.4 10.5 4.9-1.4 8.4-5.5 8.4-10.5V5.5L12 1.8z" fill="#f0b90b"/>
        <path d="M12 5.5 6.6 8v3.7c0 3.1 2.1 5.7 5.4 6.6 3.3-.9 5.4-3.5 5.4-6.6V8L12 5.5z" fill="#0b0e11"/>
        <text x="12" y="15.3" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="6.2" font-weight="800" fill="#f0b90b">B</text>
      </svg>
      <span>CoinBrave</span>
    </div>
    <nav class="nav"></nav>
  </header>

  <main class="container">
    <section class="panel">
      <div class="trade-header">
        <h2>Trade</h2>
        <input id="searchInput" class="search-bar" type="search" placeholder="Search coin or symbol…" autocomplete="off" />
      </div>
      <div id="tradeList" class="coin-list"><div class="loading">Loading markets…</div></div>
    </section>
  </main>

  <div id="tradeModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Buy</h3>
        <button id="modalClose" class="modal-close" aria-label="Close">×</button>
      </div>
      <div class="modal-body">
        <div class="modal-coin-info">
          <img id="modalImg" src="" alt="" />
          <div>
            <div id="modalCoinName"></div>
            <div id="modalCoinPrice" class="muted"></div>
          </div>
        </div>

        <div class="preset-row" id="presetRow">
          <button data-pct="25">25%</button>
          <button data-pct="50">50%</button>
          <button data-pct="100">100%</button>
        </div>

        <div class="form-group">
          <label>Amount (<span id="modalSymbol"></span>)</label>
          <input id="modalAmount" type="number" step="any" min="0" placeholder="0.00" />
        </div>
        <div class="form-group">
          <label>Total (USD)</label>
          <input id="modalTotal" type="text" readonly value="$0.00" />
        </div>
        <div class="muted" style="font-size:0.85rem;margin-bottom:8px">Fee (0.1%): $<span id="modalFee">0.00</span></div>
        <div id="modalError" class="form-error"></div>
      </div>
      <div class="modal-footer">
        <button id="modalConfirm" class="btn-primary">Confirm</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="auth.js"></script>
  <script src="trade.js"></script>
</body>
</html>
