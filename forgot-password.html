<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — CoinBrave</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="logo">
      <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 1.8 3.6 5.5v6.2c0 5 3.5 9.1 8.4 10.5 4.9-1.4 8.4-5.5 8.4-10.5V5.5L12 1.8z" fill="#f0b90b"/>
        <path d="M12 5.5 6.6 8v3.7c0 3.1 2.1 5.7 5.4 6.6 3.3-.9 5.4-3.5 5.4-6.6V8L12 5.5z" fill="#0b0e11"/>
        <text x="12" y="15.3" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="6.2" font-weight="800" fill="#f0b90b">B</text>
      </svg>
      <span>CoinBrave</span>
    </div>
    <nav class="nav"></nav>
  </header>

  <main class="auth-wrap">
    <div class="auth-card">
      <h1>Forgot your password?</h1>
      <p class="sub">Enter your email and we'll send you a reset link.</p>

      <div id="err" class="form-error"></div>
      <div id="success" class="form-error" style="color: var(--up); background: rgba(14,203,129,0.08); border: 1px solid rgba(14,203,129,0.3); padding: 12px; border-radius: 8px;"></div>

      <form id="forgotForm" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" required placeholder="you@example.com" autocomplete="email" />
        </div>
        <button id="submitBtn" class="btn-primary" type="submit">Send Reset Link</button>
      </form>

      <p class="auth-switch"><a href="login.html">← Back to login</a></p>
    </div>
  </main>

  <script src="supabase.js"></script>
  <script src="auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      cbRenderNav();
      const form = document.getElementById("forgotForm");
      const errEl = document.getElementById("err");
      const successEl = document.getElementById("success");
      const btn = document.getElementById("submitBtn");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errEl.classList.remove("show");
        successEl.style.display = "none";
        btn.disabled = true;
        btn.textContent = "Sending…";

        const email = document.getElementById("email").value.trim().toLowerCase();

        try {
          await window.sb.auth.resetPasswordForEmail(email, {
            redirectTo: `${location.origin}${location.pathname.replace(/forgot-password\.html$/, "")}reset-password.html`
          });
          successEl.textContent = "Check your inbox! If an account exists with that email, we sent a reset link. (Note: Supabase free tier sends max 2 emails/hour.)";
          successEl.style.display = "block";
          btn.textContent = "Sent";
        } catch (err) {
          console.error(err);
          errEl.textContent = err.message || "Something went wrong. Try again.";
          errEl.classList.add("show");
          btn.disabled = false;
          btn.textContent = "Send Reset Link";
        }
      });
    });
  </script>
</body>
</html>
