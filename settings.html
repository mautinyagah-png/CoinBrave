<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings — CoinBrave</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="logo">
      <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 1.8 3.6 5.5v6.2c0 5 3.5 9.1 8.4 10.5 4.9-1.4 8.4-5.5 8.4-10.5V5.5L12 1.8z" fill="#f0b90b"/>
        <path d="M12 5.5 6.6 8v3.7c0 3.1 2.1 5.7 5.4 6.6 3.3-.9 5.4-3.5 5.4-6.6V8L12 5.5z" fill="#0b0e11"/>
        <text x="12" y="15.3" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="6.2" font-weight="800" fill="#f0b90b">B</text>
      </svg>
      <span>CoinBrave</span>
    </div>
    <nav class="nav"></nav>
  </header>

  <main class="container">
    <section class="panel">
      <h2>Profile</h2>
      <div style="display:flex;gap:16px;align-items:center;margin-bottom:16px;flex-wrap:wrap">
        <div class="avatar-preview" id="avatarPreview"></div>
        <div style="flex:1;min-width:200px">
          <div class="form-group">
            <label>Display name</label>
            <input id="nameInput" type="text" />
          </div>
          <div class="form-group">
            <label>User ID (read-only)</label>
            <input id="userIdInput" type="text" readonly />
          </div>
        </div>
      </div>
      <div class="form-group">
        <label>Choose an emoji</label>
        <div class="emoji-grid" id="emojiGrid"></div>
      </div>
      <div class="form-group">
        <label>Or upload a picture (max 200KB)</label>
        <input id="avatarUpload" type="file" accept="image/*" />
        <button id="clearImageBtn" class="btn-outline" style="margin-top:8px;display:none">Use emoji instead</button>
      </div>
      <button id="saveProfileBtn" class="btn-primary">Save Profile</button>
    </section>

    <section class="panel">
      <h2>Appearance</h2>
      <div class="btn-row">
        <button id="themeDarkBtn" class="btn-outline">🌙 Dark</button>
        <button id="themeLightBtn" class="btn-outline">☀️ Light</button>
      </div>
    </section>

    <section class="panel">
      <h2>Deposit / Withdraw</h2>
      <div class="form-group">
        <label>Amount (USD)</label>
        <input id="dwAmount" type="number" min="1" step="0.01" placeholder="100.00" />
      </div>
      <div class="btn-row">
        <button id="depositBtn" class="btn-buy" style="padding:12px">⬇️ Deposit</button>
        <button id="withdrawBtn" class="btn-sell" style="padding:12px">⬆️ Withdraw</button>
      </div>
      <div id="dwError" class="form-error" style="margin-top:12px"></div>
      <p class="muted" style="font-size:0.8rem;margin-top:12px">Current cash balance: <b id="cashBalance">—</b></p>
    </section>

    <section class="panel">
      <h2>Price Alerts</h2>
      <div class="form-group">
        <label>Coin</label>
        <select id="alertCoin"></select>
      </div>
      <div class="btn-row" style="margin-bottom:16px">
        <div class="form-group" style="margin-bottom:0">
          <label>Direction</label>
          <select id="alertDirection">
            <option value="above">Goes above</option>
            <option value="below">Goes below</option>
          </select>
        </div>
        <div class="form-group" style="margin-bottom:0">
          <label>Target (USD)</label>
          <input id="alertPrice" type="number" min="0" step="0.01" placeholder="85000" />
        </div>
      </div>
      <button id="addAlertBtn" class="btn-primary">Add Alert</button>
      <div id="alertList" style="margin-top:16px"></div>
    </section>
  </main>

  <script src="auth.js"></script>
  <script src="settings.js"></script>
</body>
</html>
