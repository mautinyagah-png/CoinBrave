<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home — CoinBrave</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="logo">
      <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 1.8 3.6 5.5v6.2c0 5 3.5 9.1 8.4 10.5 4.9-1.4 8.4-5.5 8.4-10.5V5.5L12 1.8z" fill="#f0b90b"/>
        <path d="M12 5.5 6.6 8v3.7c0 3.1 2.1 5.7 5.4 6.6 3.3-.9 5.4-3.5 5.4-6.6V8L12 5.5z" fill="#0b0e11"/>
        <text x="12" y="15.3" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="6.2" font-weight="800" fill="#f0b90b">B</text>
      </svg>
      <span>CoinBrave</span>
    </div>
    <nav class="nav"></nav>
  </header>

  <main class="container">
    <section class="balance-card">
      <div class="balance-header">
        <div>
          <div class="balance-label">Portfolio Balance</div>
          <div class="balance-value" id="balanceValue">—</div>
          <div class="balance-change" id="balanceChange">—</div>
        </div>
        <button class="balance-toggle" id="balanceToggle" aria-label="Hide chart">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>
      </div>
      <div class="chart-wrap" id="chartWrap">
        <svg class="balance-chart" id="balanceChart" viewBox="0 0 400 120" preserveAspectRatio="none"></svg>
        <div class="range-tabs">
          <button data-range="1">1D</button>
          <button data-range="7" class="active">1W</button>
          <button data-range="30">1M</button>
          <button data-range="365">1Y</button>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="discovery-tabs">
        <button data-tab="favorites" class="active">★ Favorites</button>
        <button data-tab="gainers">Top Gainers</button>
        <button data-tab="losers">Top Losers</button>
      </div>
      <div id="discoveryList" class="coin-list"><div class="loading">Loading…</div></div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>Top 5 Coins</h2>
        <a href="market.html" class="btn-viewall">More →</a>
      </div>
      <div id="top5" class="coin-list"><div class="loading">Loading prices…</div></div>
    </section>
  </main>

  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
