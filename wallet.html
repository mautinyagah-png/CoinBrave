<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Wallet — CoinBrave</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="logo">
      <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 1.8 3.6 5.5v6.2c0 5 3.5 9.1 8.4 10.5 4.9-1.4 8.4-5.5 8.4-10.5V5.5L12 1.8z" fill="#f0b90b"/>
        <path d="M12 5.5 6.6 8v3.7c0 3.1 2.1 5.7 5.4 6.6 3.3-.9 5.4-3.5 5.4-6.6V8L12 5.5z" fill="#0b0e11"/>
        <text x="12" y="15.3" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="6.2" font-weight="800" fill="#f0b90b">B</text>
      </svg>
      <span>CoinBrave</span>
    </div>
    <nav class="nav"></nav>
  </header>

  <main class="container">
    <section>
      <div class="wallet-hero">
        <div class="stat-card">
          <div class="label">Portfolio Value <span class="demo-badge">DEMO</span></div>
          <div id="totalUsd" class="value gold">$—</div>
          <div id="totalChange" class="sub">24h change: —</div>
        </div>
        <div class="stat-card">
          <div class="label">Cash Balance (USD)</div>
          <div id="cashUsd" class="value">$—</div>
          <div class="sub">Available to trade</div>
        </div>
        <div class="stat-card">
          <div class="label">Assets</div>
          <div id="assetCount" class="value">—</div>
          <div class="sub">Coins in wallet</div>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>Your Holdings</h2>
      <div id="holdings" class="coin-list"><div class="loading">Loading live prices…</div></div>
    </section>
  </main>

  <script src="auth.js"></script>
  <script src="wallet.js"></script>
</body>
</html>
